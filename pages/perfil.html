
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="../styles/perfil.css">
</head>
<body>

    <main class="perfil">

        <section class="usuario">
            <img src="../images/FotoPerfil.jpeg" alt="Foto de perfil" class="foto-perfil">
            <a href="#">Editar perfil</a>
        </section>

        <section class="informacion">
            <h1>Usuario</h1>

            <div class="datos">
                <p>Película favorita:</p>
                <span>Fantastic Mr. Fox</span>

                <p>Serie favorita:</p>
                <span>Avatar The Last Airbender</span>
            </div>
        </section>

        <section class="opciones">

            <div class="opcion">
                <img src="../images/Favoritos.jpeg" alt="Favoritos" class="imagen-opcion">
                <a class="boleto">FAVORITOS</a>
            </div>

            <div class="opcion">
                <img src="../images/Lista.jpeg" alt="Mi lista" class="imagen-opcion">
                <a class="boleto">MI LISTA</a>
            </div>

            <div class="opcion">
                <img src="../images/Reseñas.jpeg" alt="Reseñas" class="imagen-opcion">
                <a class="boleto">RESEÑAS</a>
            </div>

        </section>

    </main>

</body>
</html>

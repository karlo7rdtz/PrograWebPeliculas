
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explorar películas</title>

    <link rel="stylesheet" href="../styles/buscador.css">
</head>

<body>

    <main class="buscador">

        <header class="encabezado">

            <h1>EXPLORAR</h1>

            <a href="perfil.html" class="perfil-usuario">
                <img src="../../catalogoPeliculas/public/imagenes/perfiles/FotoPerfil.jpeg" alt="Foto de perfil">
            </a>

        </header>

        <section class="seccion-busqueda">

            <form class="barra-busqueda" role="search">

                <button type="submit" class="boton-buscar">
                    &#128269;
                </button>

                <input
                    type="search"
                    name="busqueda"
                    placeholder="¿Qué quieres ver hoy?"
                    aria-label="Buscar películas"
                >

            </form>

        </section>

        <section class="seccion-generos">

            <h2>Explora por género</h2>
            <div class="linea"></div>
            <div id="carrusel-generos"></div>

        </section>

        <section class="seccion-recomendaciones">

            <h2>Recomendaciones para ti</h2>
            <div class="linea"></div>

            <div class="contenedor-recomendaciones">

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterActividadPar.jpg" alt="Película 1"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterAvatar.jpg" alt="Película 2"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterCars.jpg" alt="Película 3"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterF1.jpeg" alt="Película 4"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterInactividadPar.jpg" alt="Película 5"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterInvincible.jpg" alt="Película 6"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterObsession.webp" alt="Película 7"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterPaddington.jpeg" alt="Película 8"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterRec.jpeg" alt="Película 9"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterShrek2.webp" alt="Película 10"
                    >
                </a>

                <a href="#" class="pelicula">
                    <img
                        src="../../catalogoPeliculas/public/imagenes/posters/PosterSouthPark.jpg" alt="Película 11"
                    >
                </a>

            </div>

        </section>

    </main>

    <script crossorigin
        src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>

    <script crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>

    <script src="../components/carrusel.js"></script>

</body>
</html>

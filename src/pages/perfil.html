
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="../styles/perfil.css">
</head>

<body>

    <main class="perfil">

        <!-- Encabezado -->
        <header class="encabezado">
            <a href="#" class="volver">
                &#8592; Volver al inicio
            </a>
        </header>

        <section class="presentacion">

            <img
                src="../../catalogoPeliculas/public/imagenes/perfiles/FotoPerfil.jpeg"
                alt="Foto de perfil"
                class="foto-perfil"
            >

            <div class="informacion-usuario">

                <p class="subtitulo">PERFIL DE ESPECTADOR</p>

                <h1>Usuario</h1>

                <a href="#" class="editar">
                    EDITAR PERFIL
                </a>

            </div>

        </section>

        <section class="preferencias">

            <h2>MIS FAVORITOS</h2>

            <div class="contenedor-preferencias">

                <div class="tarjeta-preferencia">
                    <p>PELÍCULA FAVORITA</p>
                    <h3>Fantastic Mr. Fox</h3>
                </div>

                <div class="tarjeta-preferencia">
                    <p>SERIE FAVORITA</p>
                    <h3>Avatar The Last Airbender</h3>
                </div>

            </div>

        </section>

        <section class="opciones">

            <h2>MI ACTIVIDAD</h2>

            <div class="contenedor-opciones">

                <a href="#" class="opcion">

                    <img
                        src="../../catalogoPeliculas/public/imagenes/perfiles/Favoritos.jpeg"
                        alt="Favoritos"
                        class="imagen-opcion"
                    >

                    <span>FAVORITOS</span>

                </a>

                <a href="#" class="opcion">

                    <img
                        src="../../catalogoPeliculas/public/imagenes/perfiles/Lista.jpeg"
                        alt="Mi lista"
                        class="imagen-opcion"
                    >

                    <span>MI LISTA</span>

                </a>

                <a href="#" class="opcion">

                    <img
                        src="../../catalogoPeliculas/public/imagenes/perfiles/Reseñas.jpeg"
                        alt="Reseñas"
                        class="imagen-opcion"
                    >

                    <span>RESEÑAS</span>

                </a>

            </div>

        </section>

    </main>

</body>
</html>
